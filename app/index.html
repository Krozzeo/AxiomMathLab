<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom Math Lab</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong>AXIOM <span>Math Lab</span></strong><span id="state"></span><button id="save">Save</button><button id="export">Export document</button></header><main><section><p class="eyebrow">CALCULATION NOTEBOOK</p><h1 id="title"></h1><p class="hint">Sequential real calculations · pi, e · sin, cos, tan, sqrt, abs, log, exp, min, max</p><div id="cells"></div><button id="add">Add calculation</button><p id="message" role="status"></p></section><aside><h2>AI proposal</h2><p class="hint">Shared account from Platform. Your project model stays here. AI edits remain isolated until you review and apply.</p><label>Project model<input id="model" placeholder="Model ID available to your account"></label><label>Reasoning Effort<select id="reasoning"><option value="platform">Platform default</option></select></label><p id="effective-model" class="hint"></p><button id="test-model">Test project model</button><p id="model-test" role="status" class="hint"></p><label>Task<textarea id="prompt" placeholder="Add a circumference calculation"></textarea></label><button id="propose">Prepare proposal</button><button id="cancel">Cancel task</button><div id="proposal" hidden><h3>Proposed changes</h3><pre id="diff"></pre><button id="review">Review changes</button><button id="apply" disabled>Apply reviewed proposal</button><button id="discard">Discard</button></div><p id="ai-state"></p></aside></main><script type="module" src="/app.mjs"></script></body></html>
