name: Prepared Math Lab release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Krozzeo/AxiomPlatform
          ref: b91d15fa57b1dd9d465ec74ee8b25d6b809482a2
          path: .release-platform
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact release tag
        shell: pwsh
        run: |
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json')).version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/package version mismatch' }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node .release-platform/scripts/prepare-release.mjs . .axiom/release
      - name: Publish prepared artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .axiom/release/*.zip .axiom/release/axiom-release.json --verify-tag --title "Axiom Math Lab $env:GITHUB_REF_NAME" --generate-notes
